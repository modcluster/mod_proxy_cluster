name: CI
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      debug:
        description: "Test logs are generated when on"
        type: choice
        options: [ "on", "off" ]
        default: "on"

      forever-pause:
        description: "Length of a period during which tomcats are run and stopped (MODCLUSTER-736 test)"
        type: number
        default: 100

      iteration-count:
        description: "Number of iterations during which tomcats are started/stopped (Base tests)"
        type: number
        default: 2

      tomcat-cycle-count:
        description: "Number of repetitions of a test cycle (MODCLUSTER-736)"
        type: number
        default: 2

      mod_proxy_cluster:
        description: "mod_proxy_cluster tests are executed"
        type: choice
        options: [ "on", "off" ]
        default: "on"

      balancer:
        description: "mod_proxy_balancer tests are executed"
        type: choice
        options: [ "on", "off" ]
        default: "on"

env:
    IMG: local-tomcat
    HTTPD_IMG: local-httpd
    DEBUG: ${{ inputs.debug || 'on' }}
    FOREVER_PAUSE: ${{ inputs.forever-pause || 100 }}
    ITERATION_COUNT: ${{ inputs.iteration-count || 2 }}
    TOMCAT_CYCLE_COUNT: ${{ inputs.tomcat-cycle-count || 2 }}
    SKIP_CONTAINER_CREATION: 'on'

jobs:

  cmake-fedora-latest:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
            compiler: [ gcc, clang ]
            os: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Setup Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
      - name: Create container and build
        run: |
          {
              echo 'FROM fedora:44'
              echo 'RUN dnf install --assumeyes @c-development cmake httpd-devel ${{ matrix.compiler }}'
              echo 'RUN dnf clean all'
              echo 'COPY mod_proxy_cluster mod_proxy_cluster'
              echo 'WORKDIR /mod_proxy_cluster/native'
              echo 'RUN cmake . -DCMAKE_C_COMPILER=${{ matrix.compiler }}'
              echo 'RUN make'
          } > Containerfile
          podman build .

  make-fedora-latest:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Setup Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman
      - name: Create container and build
        run: |
          {
              echo 'FROM fedora:44'
              echo 'RUN dnf install --assumeyes @c-development httpd-devel redhat-rpm-config'
              echo 'RUN dnf clean all'
              echo 'COPY mod_proxy_cluster mod_proxy_cluster'
              echo 'WORKDIR /mod_proxy_cluster/native'
              echo 'RUN \'
              echo 'for module in advertise/ mod_proxy_cluster/ balancers/ mod_manager; do \'
              echo '  echo Building: $module; \'
              echo '  cd $module; \'
              echo '  sh buildconf; \'
              echo '  ./configure --with-apxs=$APACHE_DIR/bin/apxs; \'
              echo '  make clean; \'
              # Ensure the build fails in case of a failure in any of the module builds!
              echo '  make || exit 1; \'
              echo '  cd ..; \'
              echo 'done;'
          } > Containerfile
          podman build .

  clang-style-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Install clang-format and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy apache2-dev
      - name: Check styles
        run: |
          code=0
          cd mod_proxy_cluster/native
          for file in */*.c */*.h; do
            clang-format $file -n &> diff.txt;
            if [ ! -s diff.txt ]; then
              printf "%-42s ... OK\n" $file
            else
              cat diff.txt
              printf "%-42s ... NOK\n" $file
              code=1
            fi
            rm diff.txt || true # we don't fail if the file does not exist
          done;
          exit $code
      - name: Check naming conventions
        run: |
          code=0
          cd mod_proxy_cluster/native
          for file in */*.c */*.h; do
            status=0
            output=$(clang-tidy --warnings-as-errors='-*,readability-identifier-naming' "$file" -- -I/usr/include/apache2 -I/usr/include/apr-1.0 -I./include 2>&1) || status=$?
            if [ $status -eq 0 ]; then
              printf "%-42s ... OK\n" "$file"
            else
              echo "$output"
              printf "%-42s ... NOK\n" "$file"
              code=1
            fi
          done
          exit $code


  make-httpd-maintainer-mode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image-tag: [ "latest", "oldest-supported" ]
    container:
      image: quay.io/mod_cluster/ci-httpd-dev:${{ matrix.image-tag }}
    defaults:
      run:
        shell: bash
    env:
        CFLAGS: "-Wall -Werror"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Print httpd version
        run: echo $HTTPD_VERSION
      - name: Build
        run: |
          cd native
          for module in advertise/ mod_proxy_cluster/ balancers/ mod_manager/; do \
            cd $module; \
            sh buildconf; \
            ./configure --with-apxs=/usr/local/apache2/bin/apxs; \
            make clean; \
            make || exit 1; \
            cd ..; \
          done;

  make-with-httpd-trunk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: mod_proxy_cluster
      - name: Checkout latest httpd
        uses: actions/checkout@v6
        with:
          repository: apache/httpd
          path: httpd
      - name: Checkout apr for httpd
        uses: actions/checkout@v6
        with:
          repository: apache/apr
          path: httpd/srclib/apr
      - name: Install necessary packages
        run: |
          sudo apt-get update
          sudo apt-get install gcc cmake make libtool libtool-bin python3 autoconf libxml2-dev libpcre2-dev -y
      - name: Build httpd
        run: |
          export "APACHE_DIR=/usr/local/apache2/"
          cd httpd
          ./buildconf
          ./configure --prefix=/usr/local/apache2 --with-included-apr --enable-proxy-ajp --enable-maintainer-mode \
                      --enable-so --enable-proxy --enable-proxy-http --enable-proxy-wstunned --enable-proxy-hcheck \
                      --with-port=8090
          sudo make
          sudo make install
      - name: Build mod_proxy_cluster and add it to httpd
        env:
            CFLAGS: "-Wall -Werror"
        run: |
          cd mod_proxy_cluster/native
          for module in advertise/ mod_proxy_cluster/ balancers/ mod_manager/; do \
            cd $module; \
            sh buildconf; \
            ./configure --with-apxs=/usr/local/apache2/bin/apxs; \
            make clean; \
            make || exit 1; \
            sudo cp *.so /usr/local/apache2/modules; \
            cd ..; \
          done;
      - name: Preserve built Apache for perl-test job
        uses: actions/upload-artifact@v6
        with:
          name: apache-trunk
          path: /usr/local/apache2
          retention-days: 0 

  cmake-windows-latest:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
            include:
                - os: windows-latest
                  arch: amd64

                - os: windows-11-arm
                  arch: amd64 # we're cross-compiling at this point
    env:
      APACHE_LOUNGE_DISTRO_VERSION: 2.4.69-261002
      HTTPD_DEV_HOME: 'C:\Apache24'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get httpd
        run: |
          curl.exe --output "httpd-apache-lounge.zip" --url "https://www.apachelounge.com/download/VS18/binaries/httpd-${{ env.APACHE_LOUNGE_DISTRO_VERSION }}-win64-VS18.zip"
          Expand-Archive -Path "httpd-apache-lounge.zip" -DestinationPath "C:\"
      - name: Build
        run: |
          & (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\" -Filter "Launch-VsDevShell.ps1" -Recurse).FullName -Arch ${{ matrix.arch }} -SkipAutomaticLocation
          ./native/scripts/windows-build.bat
          cp cmakebuild/modules/*.so C:/Apache24/modules/
      - name: Fix and prepare config files
        run: |
          cp test\httpd\mod_proxy_cluster.conf ${{ env.HTTPD_DEV_HOME }}\conf\mod_proxy_cluster.conf
          echo "LogLevel debug"                      >> ${{ env.HTTPD_DEV_HOME }}\conf\mod_proxy_cluster.conf
          echo "Include conf/mod_proxy_cluster.conf" >> ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf
          (Get-Content ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf) | %{$_ -replace "Listen 80","#Listen 80"} | Set-Content -Path ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf
          (Get-Content ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf) | %{$_ -replace "Apache24-64","Apache24"} | Set-Content -Path ${{ env.HTTPD_DEV_HOME }}\conf\httpd.conf
      - name: Run
        run: |
          Start-Process -FilePath ${{ env.HTTPD_DEV_HOME }}\bin\httpd.exe
          curl --fail --max-time 10 http://localhost:8090
          curl --fail --max-time 10 http://localhost:8090/mod_cluster_manager
      - name: Preserve logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Windows logs for ${{ matrix.os }}
          path: C:\Apache24\logs\*log
          retention-days: 7

  # Both testsuites run against this one image, so that they exercise the very same
  # binaries and the coverage they gather can be merged (see the merged-coverage job).
  build-test-containers:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
            os: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman-docker maven git curl iproute2 wcstools zstd
          sudo touch /etc/containers/nodocker
          cd test
          sh setup-dependencies.sh
      - name: Build the test images
        run: |
          cd test
          . includes/common.sh
          test_create_all_containers
          for img in $(docker image ls --format "{{.Repository}}:{{.Tag}}" | sed 's|^localhost/||'); do
            if [[ "$img" != "$IMG"* ]] && [[ "$img" != "$HTTPD_IMG"* ]]; then continue; fi
            echo "Saving $img image"
            docker save $img | zstd -T0 -o /tmp/$(echo $img | sed 's|:|-|').tar.zst
          done
      - name: Preserve the test images
        uses: actions/upload-artifact@v6
        with:
          name: test-containers-${{ matrix.os }}
          path: /tmp/*.tar.zst
          retention-days: 1
      # the tests themselves need these, they don't run setup-dependencies.sh
      - name: Preserve the test dependencies
        uses: actions/upload-artifact@v6
        with:
          name: test-dependencies-${{ matrix.os }}
          path: |
            test/websocket/websocket-hello-0.0.1.war
            test/includes/target/test-1.0.jar
          retention-days: 1

  test-extra:
    name: test-extra (${{ matrix.os }}, ${{ matrix.test.name }})
    runs-on: ${{ matrix.os }}
    needs: build-test-containers
    strategy:
        fail-fast: false
        matrix:
              os: [ ubuntu-latest, ubuntu-24.04-arm ]
              # these tests take a lot of time, that's why we keep them separate
              test:
                - name: MODCLUSTER-736
                  script: MODCLUSTER-736/testit.sh

                - name: Hanging tests
                  script: hangingtests.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman-docker git curl iproute2 wcstools zstd
          sudo touch /etc/containers/nodocker
          # create the network (usually done by setup-dependencies.sh
          docker network create mod_proxy_cluster_testsuite_net > /dev/null 2>&1 || true
      - name: Configure Podman logging driver
        run: |
          mkdir -p ~/.config/containers
          cat <<EOF > ~/.config/containers/containers.conf
          [containers]
          log_driver = "k8s-file"

          [engine]
          events_logger = "file"
          EOF
      - name: Get the test images built
        uses: actions/download-artifact@v7
        with:
          name: test-containers-${{ matrix.os }}
          path: /tmp
      - name: Load the test images
        run: |
          cd /tmp
          for img in $(ls *.tar.zst); do
            echo "Loading $img image"
            zstd -dc $img | docker load
          done
      - name: Run ${{ matrix.test.name }}
        run: |
          cd test
          mkdir logs
          . includes/common.sh
          run_test "${{ matrix.test.script }}" "${{ matrix.test.name }}"
      - name: Preserve test logs
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && env.DEBUG == 'on' }}
        with:
          name: ${{ matrix.test.name }} logs ${{ matrix.os }}
          path: |
            test/logs/*
          retention-days: 7

  tests:
    runs-on: ${{ matrix.os }}
    needs: build-test-containers
    strategy:
        fail-fast: false
        matrix:
              os: [ ubuntu-latest, ubuntu-24.04-arm ]
              suite: [ mod_proxy_cluster, mod_proxy_balancer ]
    env:
      MOD_PROXY_CLUSTER_TESTS:  ${{ matrix.suite == 'mod_proxy_cluster'  && (inputs.mod_proxy_cluster || 'on') || 'off' }}
      MOD_PROXY_BALANCER_TESTS: ${{ matrix.suite == 'mod_proxy_balancer' && (inputs.balancer          || 'on') || 'off' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman-docker git curl iproute2 wcstools zstd
          sudo touch /etc/containers/nodocker
          # create the network (usually done by setup-dependencies.sh
          docker network create mod_proxy_cluster_testsuite_net > /dev/null 2>&1 || true
      - name: Configure Podman logging driver
        run: |
          mkdir -p ~/.config/containers
          cat <<EOF > ~/.config/containers/containers.conf
          [containers]
          log_driver = "k8s-file"

          [engine]
          events_logger = "file"
          EOF
      - name: Get the test images built
        uses: actions/download-artifact@v7
        with:
          name: test-containers-${{ matrix.os }}
          path: /tmp
      - name: Load the test images
        run: |
          cd /tmp
          for img in $(ls *.tar.zst); do
            echo "Loading $img image"
            zstd -dc $img | docker load
          done
      - name: Get the test dependencies built
        uses: actions/download-artifact@v7
        with:
          name: test-dependencies-${{ matrix.os }}
          path: test
      - name: Disable MODCLUSTER-736 and Hanging tests
        run: |
          cd test
          sed -i '/MODCLUSTER-736/s|^|#|' testsuite.sh
          sed -i '/Hanging tests/s|^|#|'  testsuite.sh
      - name: Run testsuite
        run: |
          cd test
          sh testsuite.sh
      - name: Preserve test logs
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && env.DEBUG == 'on' }}
        with:
          name: Test logs ${{ matrix.os }} ${{ matrix.suite }}
          path: |
            test/logs/*
          retention-days: 7

  perl-tests:
    runs-on: ubuntu-latest
    needs: make-with-httpd-trunk
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove apache2*
          sudo apt-get install -y gcc make perl cpanminus libcrypt-ssleay-perl
      - name: Get Apache built in the previous job
        uses: actions/download-artifact@v7
        with:
          name: apache-trunk
          path: apache2
      - name: Put httpd on the right path
        run: |
          mkdir test-perl/t/modules/
          cp apache2/modules/{mod_proxy_cluster.so,mod_manager.so,mod_advertise.so,mod_lbmethod_cluster.so} test-perl/t/modules/
          sudo mv apache2/ /usr/local/apache2/
          sudo chmod -R 755 /usr/local/apache2/
      - name: Install perl modules
        run: |
          sudo cpanm --force Apache::Test Apache::TestMM HTTP::Request LWP::UserAgent
      - name: Run testsuite
        run: |
          cd test-perl
          perl Makefile.PL -httpd /usr/local/apache2/bin/httpd
          make
          t/TEST -httpd /usr/local/apache2/bin/httpd 2>&1 | tee test-perl.log
          mv test-perl.log t/logs/test-perl.log
          grep "Result: PASS" -q t/logs/test-perl.log
          exit $?
      - name: Preserve test logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Perl tests logs
          path: |
            test-perl/t/logs/*
          retention-days: 7

  doxygen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
      - name: Build doxygen docs
        run: doxygen
      - name: Preserve doxygen docs
        uses: actions/upload-artifact@v6
        with:
          name: Doxygen docs
          path: doxygen-out/html/*
          retention-days: 30

  gather-results:
    runs-on: ubuntu-latest
    # make-with-httpd-trunk is in there transitively through perl tests 
    needs: [ tests, perl-tests, clang-style-checks, cmake-fedora-latest, make-httpd-maintainer-mode, make-fedora-latest, doxygen, cmake-windows-latest, test-extra ]
    steps:
      - name: Delete all the containers/dependencies we no longer need
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            test-containers*
            test-dependencies*
          failOnError: false
      - name: Merge all the logs
        uses: actions/upload-artifact/merge@v6
        with:
          name: Test logs
          pattern: '*logs*'
          separate-directories: true
          delete-merged: true
          retention-days: 7

